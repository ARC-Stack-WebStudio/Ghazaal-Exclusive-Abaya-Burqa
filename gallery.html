        body {
            background: #000;

        .gallery-section {
            padding: 120px 0 80px;

        .gallery-title {
            text-align: center;
            margin-bottom: 50px;
        }

        .gallery-title h1 {
            color: #D4AF37;
            font-weight: 700;
        }

        .gallery-item {
            overflow: hidden;
            border-radius: 15px;
            margin-bottom: 25px;
            position: relative;
            cursor: pointer;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.5s;
        }

        .gallery-item:hover img {
            transform: scale(1.08);
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, .5);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: 0.4s;
        }

        .gallery-item:hover .overlay {
            opacity: 1;
        }

        .overlay i {
            font-size: 40px;
            color: #D4AF37;
        }

        .whatsapp-btn {
            background: #25D366;
            color: #fff;
            padding: 12px 30px;
            border-radius: 50px;
            display: inline-block;
            margin-top: 30px;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
